<main>
  <div class="container my-4">
    <h3 class="mb-3">
      <i class="bi bi-x-circle-fill"></i> Formularios Devueltos
    </h3>

    <div *ngIf="formularios.length === 0" class="alert alert-info">
      No hay formularios devueltos.
    </div>

    <div class="table-responsive" *ngIf="formularios.length > 0">
      <table class="table table-bordered table-hover text-center align-middle">
        <thead class="table-dark">
          <tr>
            <th scope="col">#</th>
            <th scope="col">Motivo de Devolución</th>
            <th scope="col">Revisado por</th>
            <th scope="col">Fecha de Devolución</th>
            <th scope="col">Descargar</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let f of formularios; let i = index">
            <td>{{ i + 1 }}</td>
            <td class="text-break">{{ f.motivoDenegacion || '---' }}</td>
            <td>{{ f.nombreRevisor || '---' }}</td>
            <td>{{ f.fechaRevision | date: 'short' }}</td>
            <td>
              <button class="btn btn-info btn-sm" (click)="descargarFormulario(f.idFormulario)">
                Descargar
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
