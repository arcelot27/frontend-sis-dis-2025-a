<div class="container mt-5">
  <div class="text-center mb-4">
    <h3 class="text-white bg-dark py-3 rounded">Historial de Formularios</h3>
  </div>

  <div class="card shadow">
    <div class="card-body p-0">
      <table class="table table-bordered table-hover mb-0">
        <thead class="table-dark text-center">
          <tr>
            <th>Fecha</th>
            <th>Acción</th>
            <th>Usuario</th>
            <th>Descripción</th>
            <th>Descargar</th>
          </tr>
        </thead>
        <tbody *ngIf="historial?.length; else sinRegistros">
          <tr *ngFor="let item of historial">
            <td>{{ item.fecha | date:'short' }}</td>
            <td>{{ item.accion }}</td>
            <td>{{ item.usuario }}</td>
            <td>{{ item.descripcion }}</td>
            <td class="text-center">
              <button class="btn btn-sm btn-success" (click)="descargarExcel(item.formulario?.idFormulario)" [disabled]="!item.formulario?.idFormulario">📥 Excel</button>
            </td>
          </tr>
        </tbody>
      </table>

      <ng-template #sinRegistros>
        <tr>
          <td colspan="5" class="text-center p-3">No hay registros disponibles.</td>
        </tr>
      </ng-template>
    </div>

    <div class="card-footer d-flex justify-content-end gap-2">
      <button class="btn btn-secondary" (click)="DevolverDashboard()">Volver</button>
      <button class="btn btn-success" (click)="descargarHistorialCompleto()">Descargar todo en Excel</button>
    </div>
  </div>
</div>
