<div class="container py-5">
  <div class="row">
    <div class="col-md-5">
      <h5 class="fw-bold">Perfil Administrador</h5>
      <form *ngIf="usuario">
        <div class="mb-3">
          <label class="form-label">Rol</label>
          <input type="text" class="form-control" [value]="usuario.rol" disabled>
        </div>

        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" [(ngModel)]="usuario.nombre" name="nombre" [disabled]="inputsDeshabilitados">
        </div>

        <div class="mb-3">
          <label class="form-label">Correo</label>
          <input type="email" class="form-control" [value]="usuario.correo" disabled>
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <div class="input-group">
            <input [type]="mostrarContrasena ? 'text' : 'password'" class="form-control" [(ngModel)]="usuario.contrasena" name="contrasena" [disabled]="inputsDeshabilitados">
            <button type="button" class="btn btn-outline-secondary" (click)="toggleMostrarContrasena()" [disabled]="inputsDeshabilitados">
              {{ mostrarContrasena ? '🙈' : '👁' }}
            </button>
          </div>
        </div>

        <button type="button" class="btn btn-primary w-100" (click)="editar()">
          {{ inputsDeshabilitados ? 'Editar' : 'Guardar' }}
        </button>
      </form>
    </div>

    <div class="col-md-6 text-center" style="margin-top: 8rem;">
      <p>Dashboard de administración general</p>
      <!-- Puedes agregar botones para navegación futura aquí -->
    </div>
  </div>
</div>
