
<div class="fondo">
  <div class="overlay">
    <div class="contenedor-formulario">
      <div class="lateral">
        <h2>Formulario</h2>
      </div>

      <div class="formulario">
        <h3>Agenda Intersemestral<br>Profesoral</h3>

        <div class="formulario-grid">
          <div class="campo">
            <label for="nombres">Nombres:</label>
            <input type="text" id="nombres" [(ngModel)]="formulario.nombres" name="nombres" required />
          </div>

          <div class="campo">
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" [(ngModel)]="formulario.apellidos" name="apellidos" required />
          </div>

          <div class="campo">
            <label for="facultad">Facultad:</label>
            <input type="text" id="facultad" [(ngModel)]="formulario.facultad" name="facultad" />
          </div>

          <div class="campo">
            <label for="programa">Programa:</label>
            <input type="text" id="programa" [(ngModel)]="formulario.programa" name="programa" />
          </div>

          <div class="campo">
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" [(ngModel)]="formulario.fecha" name="fecha" />
          </div>

          <div class="campo">
            <label for="periodo">Periodo:</label>
            <input type="text" id="periodo" [(ngModel)]="formulario.periodo" name="periodo" />
          </div>
        </div>

        <div class="botones">
          <button (click)="volverADashboard()">Atrás</button>
          <button (click)="guardarYIrALaboresAcademicas()">Siguiente</button>
        </div>
      </div>
    </div>
  </div>
</div>
