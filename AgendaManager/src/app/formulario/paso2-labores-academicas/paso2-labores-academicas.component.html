<div class="fondo">
  <div class="overlay">
    <div class="contenedor-formulario">
      <div class="formulario">

        <h3>1. LABORES DE DOCENCIA, ACADÉMICAS Y FORMATIVAS</h3>

        <!-- 1.1 Información básica -->
        <h4>1.1 Datos Generales</h4>
        <div class="formulario-grid">
          <div class="campo">
            <label>Nombre Asignatura:</label>
            <input type="text" />
          </div>
          <div class="campo">
            <label>Programa:</label>
            <input type="text" />
          </div>
          <div class="campo">
            <label>Grupo:</label>
            <input type="text" />
          </div>
          <div class="campo">
            <label>Sede:</label>
            <input type="text" />
          </div>
          <div class="campo">
            <label>Dedicación de horas (SEMANALES):</label>
            <input type="text" />
          </div>
          <div class="campo">
            <label>Dedicación de horas (SEMESTRALES):</label>
            <input type="text" />
          </div>
        </div>

        <!-- 1.2 Actividades académicas -->
        <h4>1.2 Actividades Académicas</h4>
        <div class="formulario-grid-actividades">
          <div class="etiqueta-fila">Preparación de clases</div>
          <input type="text" placeholder="Horas Semana" />
          <input type="text" placeholder="Horas Semestre" />
          <input type="text" placeholder="Descripción" />
          <input type="text" placeholder="Producto" />

          <div class="etiqueta-fila">Evaluación de aprendizajes</div>
          <input type="text" />
          <input type="text" />
          <input type="text" />
          <input type="text" />

          <div class="etiqueta-fila">Gestión de eventos académicos</div>
          <input type="text" />
          <input type="text" />
          <input type="text" />
          <input type="text" />
        </div>

        <!-- 1.3 Actividades formativas -->
        <h4>1.3 Actividades Formativas</h4>
        <div class="formulario-grid-actividades">
          <div class="etiqueta-fila">Acompañamiento académico</div>
          <input type="text" />
          <input type="text" />
          <input type="text" />
          <input type="text" />

          <div class="etiqueta-fila">Cursos de fortalecimiento</div>
          <input type="text" />
          <input type="text" />
          <input type="text" />
          <input type="text" />

          <div class="etiqueta-fila">Asesoría en emprendimiento</div>
          <input type="text" />
          <input type="text" />
          <input type="text" />
          <input type="text" />
        </div>

        <div class="botones">
          <button (click)="volverAFormulario()">Volver</button>
          <button (click)="irALaboresCientificas()">Siguiente</button>
        </div>

      </div>
    </div>
  </div>
</div>
